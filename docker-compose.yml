services:
  db:
    image: postgres:16-alpine
    container_name: srms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: srms
      POSTGRES_PASSWORD: srms
      POSTGRES_DB: srms
    ports:
      - "5440:5432"
    volumes:
      - srms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srms -d srms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  srms-pgdata:
